services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bingwapulse
      POSTGRES_USER: bingwapulse
      POSTGRES_PASSWORD: bingwapulse
    ports:
      - "5432:5432"
    volumes:
      - bingwapulse_db:/var/lib/postgresql/data
      - ./db/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bingwapulse -d bingwapulse"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  bingwapulse_db:
