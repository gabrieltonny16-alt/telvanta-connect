name: BingwaPulse API checks
on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install API dependencies
        working-directory: api
        run: npm install
      - name: Check syntax
        working-directory: api
        run: npm run check
      - name: Run API unit tests
        working-directory: api
        run: npm test
